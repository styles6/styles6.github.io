story_heading: Our story
story_text: |
  Formed in 2004, Dynamic Dance is a hip-hop dance team created at the University of Maryland by founder Aurelia Michael. Arriving on campus, Aurelia set out to immerse herself in the dance community, but she noticed a significant gap in the existing opportunities and felt compelled to fill it. She established Dynamic Dance in the fall semester of 2004 to inspire and cultivate a new generation of talented dancers.

  With a focus on excellence and artistry, Aurelia built a team rooted in determination, creativity, and a commitment to mastering hip-hop. Dynamic quickly rose to prominence, winning multiple competitions, performing for the Washington Wizards, showcasing at the European Embassy, and being featured in Funk Academy. Over the years the team has far surpassed her original vision and become a cornerstone of dance at the University of Maryland.
